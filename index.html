  <body>
    <div id="root"></div>
    <script>
      (function () {
        var reloadKey = "aadate_chunk_reload_v1";
        function looksLikeChunkLoadError(message) {
          return /Failed to fetch dynamically imported module|Loading chunk|Importing a module script failed/i.test(String(message || ""));
        }
        async function clearRuntimeCaches() {
          if ("caches" in window) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (key) { return caches.delete(key); }));
          }
          if ("serviceWorker" in navigator) {
            var registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(function (registration) { return registration.update(); }));
          }
        }
        function recoverFromChunkError(event) {
          var message = event && (event.message || (event.reason && event.reason.message) || event.reason);
          if (!looksLikeChunkLoadError(message) || sessionStorage.getItem(reloadKey) === "1") return;
          sessionStorage.setItem(reloadKey, "1");
          clearRuntimeCaches().finally(function () { window.location.reload(); });
        }
        window.addEventListener("error", recoverFromChunkError);
        window.addEventListener("unhandledrejection", recoverFromChunkError);
        window.addEventListener("load", function () { sessionStorage.removeItem(reloadKey); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
